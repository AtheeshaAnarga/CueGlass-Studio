<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- macOS Tahoe Squircle Base Gradient -->
    <linearGradient id="tahoeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6BFF" />
      <stop offset="45%" stop-color="#0D3B9E" />
      <stop offset="100%" stop-color="#071946" />
    </linearGradient>

    <!-- Liquid Glass Specular Lens Overlay -->
    <radialGradient id="liquidSpecular" cx="28%" cy="16%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="38%" stop-color="#7DD3FC" stop-opacity="0.28" />
      <stop offset="75%" stop-color="#1D4ED8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22" />
    </radialGradient>

    <!-- Frosted Inner Teleprompter Card Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="55%" stop-color="#E0F2FE" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.78" />
    </linearGradient>

    <!-- Droplet Prism Gradient -->
    <linearGradient id="dropletGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="softDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.42" />
    </filter>
  </defs>

  <!-- 1. macOS 26 Tahoe Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#tahoeBase)" />
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#liquidSpecular)" />
  <rect x="34" y="34" width="444" height="444" rx="102" ry="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="4" />

  <!-- Top Camera-Notch Alignment Pill Reference -->
  <rect x="206" y="58" width="100" height="16" rx="8" fill="#040B1E" fill-opacity="0.55" stroke="#7DD3FC" stroke-opacity="0.45" stroke-width="2" />
  <circle cx="256" cy="66" r="4" fill="#38BDF8" />

  <!-- 2. Floating Liquid Glass Teleprompter Panel -->
  <g filter="url(#softDropShadow)">
    <rect x="88" y="102" width="336" height="298" rx="48" fill="url(#glassCard)" stroke="#FFFFFF" stroke-width="4" />

    <!-- Active Beat Focus Bar (Left Edge) -->
    <rect x="116" y="168" width="10" height="78" rx="5" fill="#1D4ED8" />

    <!-- Active Spoken Beat Highlight Card -->
    <rect x="136" y="164" width="256" height="86" rx="20" fill="#FFFFFF" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2.5" />
    <rect x="154" y="184" width="168" height="16" rx="8" fill="#0F172A" />
    <rect x="154" y="212" width="214" height="16" rx="8" fill="#1E40AF" />

    <!-- Upcoming Spoken Beat Lines (Dimmed) -->
    <rect x="136" y="274" width="224" height="14" rx="7" fill="#334155" fill-opacity="0.55" />
    <rect x="136" y="302" width="184" height="14" rx="7" fill="#334155" fill-opacity="0.42" />

    <!-- Organizer Cue Pill Badge at Bottom -->
    <rect x="136" y="338" width="144" height="28" rx="14" fill="#F59E0B" fill-opacity="0.22" stroke="#D97706" stroke-opacity="0.55" stroke-width="2" />
    <circle cx="154" cy="352" r="5" fill="#D97706" />
    <rect x="168" y="347" width="94" height="10" rx="5" fill="#92400E" />
  </g>

  <!-- 3. Refractive Liquid Glass Droplet Emblem (Bottom-Right Corner) -->
  <g filter="url(#softDropShadow)">
    <path d="M388 292 C388 292 438 352 438 386 C438 414 415.6 436 388 436 C360.4 436 338 414 338 386 C338 352 388 292 388 292 Z" fill="url(#dropletGrad)" stroke="#FFFFFF" stroke-width="4" />
    <ellipse cx="374" cy="374" rx="10" ry="18" transform="rotate(-22 374 374)" fill="#FFFFFF" fill-opacity="0.78" />
  </g>
</svg>
